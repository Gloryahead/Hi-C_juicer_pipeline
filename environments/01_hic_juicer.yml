# Core Hi-C toolchain: QC/trim + alignment + Juicer's own contact-map/TAD/loop
# tools (all invoked via juicer_tools.jar, so only a JVM is needed for those —
# no separate peak-caller/eigenvector package). One container, mirroring how
# containers/wgs_core.def bundles QC+align+calling for the WGS pipeline: the
# whole chain from FASTQ to inter_30.hic is one dependency graph internal to
# Juicer, so it isn't worth splitting into narrower per-tool containers.
# Build: micromamba env create -f environments/01_hic_juicer.yml --yes
name: hic_juicer_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - openjdk=17                  # juicer_tools.jar (HiCCUPS/Arrowhead/dump/eigenvector) needs a modern JVM; 17 validated against juicer_tools 2.17.00
  - bwa=0.7.19                  # tutorial uses classic BWA-MEM, not bwa-mem2 — Juicer's own scripts assume classic bwa's exact stderr/index-file format. Not 0.7.17: bioconda never rebuilt that old a build against modern zlib (only libzlib<1.3 builds exist), which conflicts with samtools=1.23's libzlib>=1.3.1 requirement in the same env — 0.7.19 is the same `bwa mem` behavior, just a build with a compatible zlib pin
  - samtools=1.23
  - sra-tools=3.4.1             # prefetch/fasterq-dump for the tutorial's SRR1658570 test dataset. NOT 2.9.6 (what the sibling WGS pipeline pins): that 2019-era build bundles its own mbedtls TLS stack with an outdated cert trust store — every connection to NCBI now fails TLS handshake with "certificate is not correctly signed by the trusted CA" (hit this for real against live NCBI infra). 3.4.1 depends on the system ca-certificates package instead of a frozen bundle.
  - fastqc=0.12.*
  - trim-galore=0.6.*
  - multiqc=1.22.*
  - gawk                        # juicer.sh's internal scripts are gawk-specific (not POSIX awk) — required, not optional
  - parallel=20240722            # GNU parallel — juicer.sh's chunked alignment stage
  - htslib                       # tabix/bgzip, used by a few juicer helper scripts — left unpinned: samtools=1.23 requires htslib>=1.23, which conflicted with an earlier =1.20 pin here (copy-pasted from the sibling WGS env without checking); htslib's exact version isn't load-bearing for Hi-C outputs the way bwa/samtools/juicer's are
  - git                          # scripts/02_setup_juicer.sh clones aidenlab/juicer at build time
  - wget
